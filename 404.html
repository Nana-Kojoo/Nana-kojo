<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Asare Elvis Kojo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<script>
  (function(){
    try {
      var t = localStorage.getItem('asarekojo-theme');
      if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch(e){}
  })();
</script>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="notfound">
    <img class="avatar avatar--md" src="/assets/avatar.jpg" alt="" width="56" height="56">
    <h1>Hmm… this page doesn't exist.</h1>
    <p>The link may be broken, or the page may have moved.</p>
    <a class="btn btn--invert btn--lg" href="/">Back to the profile</a>
  </main>
</body>
</html>
